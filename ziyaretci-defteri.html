<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Başkent Rehberi - Ziyaretçi Defteri</title>
</head>
<body>
    <header>
        <h1>BAŞKENT REHBERİ</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="gezilecek-yerler.html">Gezilecek Yerler</a></li>
                <li><a href="muzeler.html">Müzeler</a></li>
                <li><a href="lezzetler.html">Ne Yenir?</a></li>
                <li><a href="ziyaretci-defteri.html">Ziyaretçi Defteri</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="ziyaretci-defteri">
            <h2>Ziyaretçi Defteri</h2>
            <p>Ankara'daki geziniz nasıldı? Deneyimlerinizi ve mekan önerilerinizi bizimle paylaşın.</p>
            <hr>

            
            <form action="#" method="get" id="yorumFormu">
                <p>
                    <label for="adsoyad">Adınız Soyadınız:</label><br>
                    <!-- isim -->
                    <input type="text" id="adsoyad" name="adsoyad" placeholder="Örn. Mehmet Akif" required>
                </p>
                
                <p>
                    Ziyaret Amacınız:<br>
                    <!-- tekli seçmeli -->
                    <input type="radio" id="turistik" name="amac" value="turistik" checked>
                    <label for="turistik">Turistik Gezi</label>
                    
                    <input type="radio" id="ogrenci" name="amac" value="ogrenci">
                    <label for="ogrenci">Öğrencilik / Eğitim</label>
                </p>

                <p>
                    <label for="favori">En Sevdiğiniz Yer:</label><br>
                    <!-- Açılır liste -->
                    <select id="favori" name="favori">
                        <option value="anitkabir">Anıtkabir</option>
                        <option value="kale">Ankara Kalesi</option>
                        <option value="kugulu">Kuğulu Park</option>
                        <option value="diger">Diğer (Lütfen yorumda belirtin)</option>
                    </select>
                </p>

                <p>
                    <label for="yorum">Yorumunuz ve Mekan Öneriniz:</label><br>
                    <!-- Uzun metin -->
                    <textarea id="yorum" name="yorum" rows="4" cols="40" required></textarea>
                </p>

                <!-- Form gönderme butonu -->
                <button type="submit">Yorumu Gönder</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Ağ Tabanlı Programlama Projesi</p>
    </footer>
</body>
</html>
